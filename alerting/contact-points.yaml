apiVersion: 1
contactPoints:
    - orgId: 2
      name: NTFY
      receivers:
        - uid: eeoh30tzzl91cf
          type: webhook
          settings:
            authorization_credentials: '[REDACTED]'
            authorization_scheme: Bearer
            httpMethod: POST
            message: '{{ template "default.message" . }}'
            payload:
                template: '{{ template "webhook.default.payload" . }}'
            title: '{{ template "default.title" . }}'
            url: https://ntfy.cybris.net/grafana?template=yes&title=%7B%7B.title%7D%7D&message=%7B%7B.message%7D%7D&priority=5&tags=grafana%2Cwarning
          disableResolveMessage: false
    - orgId: 2
      name: email receiver
      receivers:
        - uid: ""
          type: email
          settings:
            addresses: <example@email.com>
          disableResolveMessage: false
