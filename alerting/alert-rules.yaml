    - orgId: 2
      name: logs
      folder: Alert Rules
      interval: 10m
      rules:
        - uid: fg2j451u4cb9cd
          title: HostStoppedLogging
          condition: C
          data:
            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cefqyqv6j9c00e
              model:
                editorMode: code
                expr: (sum by (instance) (count_over_time({instance=~".+", instance!="quicksilver.sleem.net"}[6h])) > 0) unless (sum by (instance) (count_over_time({instance=~".+", instance!="quicksilver.sleem.net"}[1h])) > 0)
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            description: 'Loki holds lines from {{ $labels.instance }} within the last 6 hours but none in the last hour. The host is up (or ScrapeTargetDown would say otherwise), so its Alloy stopped shipping: the FreeBSD file tail lost the logread group, the journal source on a podman host stopped, or Loki rejected the push. quicksilver is excluded. On the host: sudo service alloy status / sudo systemctl status alloy; then Alloy''s own log for loki.write errors; then a deliberate logger test line and query it in Explore (loki). Clears when lines resume.'
            summary: '{{ $labels.instance }} has sent no logs to Loki for over an hour'
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: NTFY
        - uid: ag2j452ox38qob
          title: UniFiGatewayStoppedLogging
          condition: C
