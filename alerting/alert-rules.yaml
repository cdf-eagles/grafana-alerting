            - refId: A
              queryType: instant
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cefqyqv6j9c00e
              model:
                editorMode: code
                expr: (sum by (hostname) (count_over_time({job="integrations/syslog", hostname="unifi-dm01"}[24h])) > 0) unless (sum by (hostname) (count_over_time({job="integrations/syslog", hostname="unifi-dm01"}[2h])) > 0)
                intervalMs: 1000
                maxDataPoints: 43200
                queryType: instant
                refId: A
