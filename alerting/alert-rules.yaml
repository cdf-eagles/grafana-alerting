                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            description: 'job integrations/syslog holds lines from {{ $labels.hostname }} within the last 24 hours but none in the last 2 hours. Only unifi-dm01 is watched: the gateway logs continuously (firewall, DHCP, IDS), while the switches and APs can be silent for hours and are covered by UniFiDeviceStoppedReporting (unpoller) instead. Causes: remote syslog turned off in the UniFi console, or soundwave''s Alloy syslog listener (TCP 51893 / UDP 51898) stopped. On soundwave: sudo service alloy status; sockstat -l | grep 5189. Clears when lines resume.'
            summary: '{{ $labels.hostname }} has sent no syslog to soundwave for over 2 hours'
          labels:
