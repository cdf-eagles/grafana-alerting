            description: '{{ $value | humanize }} lock waits per second. Consider using InnoDB instead of MyISAM or optimizing queries.'
            summary: High table lock waits on {{ $labels.instance }}
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: NTFY
        - uid: cg2j3wgq26vpce
          title: BlackboxProbeFailed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cei7lwvco16o0b
              model:
                editorMode: code
                expr: probe_success{job=~"blackbox_(http|tls|ldaps|healthchecks)", instance!="https://vault.sleem.net/v1/sys/health"} == 0
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 'probe_success has been 0 for 5 minutes for {{ $labels.instance }} in job {{ $labels.job }}. blackbox_tls: the TLS handshake or certificate chain failed (expired, wrong name, or the vhost is gone), not only expiry. blackbox_http: the page did not return its expected status. blackbox_ldaps: LDAPS on ldap or ldap02 refused. blackbox_healthchecks: a Mimir, Loki, Tempo, unpoller or exportarr /metrics endpoint on podman01 is down. Read the failure in Explore (mimir): probe_failed_due_to_regex, probe_http_status_code and probe_ssl_last_chain_info for the same instance, then curl -vk the target from podman01. The vault health probe is excluded here; OpenBaoSealedOrDown owns it. A probe whose series vanished is ScrapeTargetVanished''s job.'
            summary: Blackbox probe of {{ $labels.instance }} ({{ $labels.job }}) is failing
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: NTFY
        - uid: fg2j40ao1tr7kb
          title: TailscaleKeyExpiring
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cei7lwvco16o0b
              model:
                editorMode: code
                expr: ((tailscale_devices_expires_timestamp - time()) / 86400 < 14) and on (id) tailscale_devices_key_expiry_disabled == 0
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - -1e+09
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1h
          annotations:
            description: tailscale_devices_expires_timestamp for {{ $labels.name }} is under 14 days away and key expiry is not disabled for it. When it expires the node drops off the tailnet; for an exit node that strands the phones. Either re-authenticate on the device (tailscale up) or disable key expiry for infrastructure nodes in the Tailscale admin console (Machines, the node, Disable key expiry); Ansible-enrolled nodes can be re-provisioned with the OAuth key.
            summary: Tailscale key for {{ $labels.hostname }} expires in {{ printf "%.0f" $values.A.Value }} days
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: NTFY
