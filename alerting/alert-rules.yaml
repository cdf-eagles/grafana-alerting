                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            description: 'tailscale_devices_online has been 0 for 10 minutes for {{ $labels.name }}: one of the exit nodes or infrastructure nodes (exitnode, soundwave, shockwave, persephone) has left the tailnet. The phones fall back to the next exit node (exitnode, shockwave, soundwave, then the Apple TVs). On the host: tailscale status; sudo service tailscaled restart (FreeBSD) or the Tailscale app on shockwave. During a soundwave patch window, silence this rule for soundwave.'
            summary: Tailscale node {{ $labels.hostname }} is offline
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: NTFY
