apiVersion: 1
groups:
    - orgId: 2
      name: applications
      folder: Alert Rules
      interval: 5m
      rules:
        - uid: cep5pp5gfcdtsc
          title: TLSCertificateExpiring7Day
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cei7lwvco16o0b
              model:
                editorMode: code
                expr: probe_ssl_earliest_cert_expiry - time() < 7 * 86400
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: 'The certificate for {{ $labels.instance }} expires in less than 7 days, or has already expired (the value goes negative). Renew by hand on the host now and find out why the scheduled renewal failed (Let''s Encrypt rate limits apply: do not loop certbot).'
            summary: Certificate for {{ $labels.instance }} expires in under 7 days
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: NTFY
        - uid: dep5pr8lwv8cgf
          title: TLSCertificateExpiring14Day
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cei7lwvco16o0b
              model:
                editorMode: code
                expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400 >= 7 * 86400
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            description: The certificate for {{ $labels.instance }} expires in less than 14 days (and more than 7; the 7Day rule fires below that). Let's Encrypt renews at 30 days, so a certificate this close means the renewal job on its host has failed twice or more. Check the certbot/acme log on the host and the httpd reload; Uptime Kuma's TLS group warns at 21/14/7 days on the same hosts.
            summary: Certificate for {{ $labels.instance }} expires in under 14 days
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: NTFY
        - uid: dfbc836y7mqrkf
          title: MariaDBHighTableLockWaits
          condition: C
